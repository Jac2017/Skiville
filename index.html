<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkiVille - Whistler Blackcomb Tycoon</title>
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loading-content">
      <div class="mountain-logo">
        <svg viewBox="0 0 200 120" class="mountain-svg">
          <polygon points="50,100 100,20 150,100" fill="#2d5a87" stroke="#4a90d9" stroke-width="2"/>
          <polygon points="80,100 120,45 160,100" fill="#1e3a5f" stroke="#3a7bc8" stroke-width="2"/>
          <polygon points="85,55 100,20 115,55" fill="#fff" opacity="0.8"/>
          <polygon points="110,65 120,45 135,70" fill="#fff" opacity="0.6"/>
        </svg>
      </div>
      <h1>SKIVILLE</h1>
      <h2>Whistler Blackcomb Tycoon</h2>
      <div class="loading-bar-container">
        <div class="loading-bar" id="loading-bar"></div>
      </div>
      <p class="loading-text" id="loading-text">Initializing terrain...</p>
      <p class="loading-tip">Inspired by Vail Resorts &bull; Winter Resort Simulator</p>
    </div>
  </div>

  <!-- Main Game Container -->
  <div id="game-container" style="display:none;">
    <!-- Cesium 3D Viewport -->
    <div id="cesium-container"></div>

    <!-- Game Canvas Overlay for custom rendering -->
    <canvas id="game-overlay"></canvas>

    <!-- Top HUD Bar -->
    <div id="top-hud">
      <div class="hud-section hud-left">
        <div class="hud-item" id="hud-date">
          <span class="hud-icon">📅</span>
          <span class="hud-value" id="game-date">Dec 1, 2024</span>
        </div>
        <div class="hud-item" id="hud-time">
          <span class="hud-icon">🕐</span>
          <span class="hud-value" id="game-time">08:00</span>
        </div>
        <div class="hud-item" id="hud-weather">
          <span class="hud-icon" id="weather-icon">🌨️</span>
          <span class="hud-value" id="weather-temp">-5°C</span>
        </div>
        <div class="hud-item" id="hud-snow">
          <span class="hud-icon">❄️</span>
          <span class="hud-value" id="snow-depth">180cm base</span>
        </div>
      </div>
      <div class="hud-section hud-center">
        <div class="speed-controls">
          <button class="speed-btn" id="speed-pause" title="Pause">⏸</button>
          <button class="speed-btn active" id="speed-1x" title="Normal">▶</button>
          <button class="speed-btn" id="speed-2x" title="Fast">▶▶</button>
          <button class="speed-btn" id="speed-3x" title="Very Fast">▶▶▶</button>
        </div>
      </div>
      <div class="hud-section hud-right">
        <div class="hud-item hud-money">
          <span class="hud-icon">💰</span>
          <span class="hud-value" id="game-money">$50,000,000</span>
        </div>
        <div class="hud-item">
          <span class="hud-icon">👥</span>
          <span class="hud-value" id="guest-count">0 guests</span>
        </div>
        <div class="hud-item">
          <span class="hud-icon">⭐</span>
          <span class="hud-value" id="resort-rating">3.5</span>
        </div>
      </div>
    </div>

    <!-- Side Panel (Context-sensitive) -->
    <div id="side-panel" class="panel-hidden">
      <div class="panel-header">
        <h3 id="panel-title">Details</h3>
        <button class="panel-close" id="panel-close">&times;</button>
      </div>
      <div class="panel-content" id="panel-content"></div>
    </div>

    <!-- Bottom Toolbar -->
    <div id="bottom-toolbar">
      <div class="toolbar-group">
        <button class="toolbar-btn" data-tool="overview" title="Resort Overview">
          <div class="btn-icon">🏔️</div>
          <div class="btn-label">Overview</div>
        </button>
        <button class="toolbar-btn" data-tool="lifts" title="Lift Management">
          <div class="btn-icon">🚡</div>
          <div class="btn-label">Lifts</div>
        </button>
        <button class="toolbar-btn" data-tool="runs" title="Ski Runs">
          <div class="btn-icon">⛷️</div>
          <div class="btn-label">Runs</div>
        </button>
        <button class="toolbar-btn" data-tool="snowmaking" title="Snowmaking">
          <div class="btn-icon">🌨️</div>
          <div class="btn-label">Snow</div>
        </button>
        <button class="toolbar-btn" data-tool="grooming" title="Grooming">
          <div class="btn-icon">🚜</div>
          <div class="btn-label">Groom</div>
        </button>
      </div>
      <div class="toolbar-divider"></div>
      <div class="toolbar-group">
        <button class="toolbar-btn" data-tool="hotels" title="Hotels & Lodging">
          <div class="btn-icon">🏨</div>
          <div class="btn-label">Hotels</div>
        </button>
        <button class="toolbar-btn" data-tool="restaurants" title="Restaurants & Bars">
          <div class="btn-icon">🍽️</div>
          <div class="btn-label">Dining</div>
        </button>
        <button class="toolbar-btn" data-tool="shops" title="Retail & Rentals">
          <div class="btn-icon">🏪</div>
          <div class="btn-label">Shops</div>
        </button>
        <button class="toolbar-btn" data-tool="condos" title="Condos & Real Estate">
          <div class="btn-icon">🏢</div>
          <div class="btn-label">Condos</div>
        </button>
        <button class="toolbar-btn" data-tool="parking" title="Parking & Transport">
          <div class="btn-icon">🅿️</div>
          <div class="btn-label">Parking</div>
        </button>
      </div>
      <div class="toolbar-divider"></div>
      <div class="toolbar-group">
        <button class="toolbar-btn" data-tool="staff" title="Staff Management">
          <div class="btn-icon">👷</div>
          <div class="btn-label">Staff</div>
        </button>
        <button class="toolbar-btn" data-tool="finance" title="Finances">
          <div class="btn-icon">📊</div>
          <div class="btn-label">Finance</div>
        </button>
        <button class="toolbar-btn" data-tool="marketing" title="Marketing & Passes">
          <div class="btn-icon">📢</div>
          <div class="btn-label">Marketing</div>
        </button>
        <button class="toolbar-btn" data-tool="settings" title="Game Settings">
          <div class="btn-icon">⚙️</div>
          <div class="btn-label">Settings</div>
        </button>
      </div>
    </div>

    <!-- Notification Area -->
    <div id="notification-area"></div>

    <!-- Mini Map -->
    <div id="mini-map">
      <canvas id="mini-map-canvas" width="200" height="200"></canvas>
      <div class="minimap-label">Whistler Blackcomb</div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
